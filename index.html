<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Admin Seblak</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar">

    <h1>
      ADMIN SEBLAK
    </h1>

    <div class="live-box">

      <span class="dot"></span>

      REALTIME

    </div>

  </nav>

  <!-- STATS -->

  <section class="stats">

    <div class="stat-card">

      <h3>Total Order</h3>

      <h2 id="totalOrders">
        0
      </h2>

    </div>

    <div class="stat-card">

      <h3>Pendapatan Seblak</h3>

      <h2 id="foodIncome">
        Rp 0
      </h2>

    </div>

    <div class="stat-card">

      <h3>Total Ongkir</h3>

      <h2 id="shippingIncome">
        Rp 0
      </h2>

    </div>

    <div class="stat-card">

      <h3>Total Semua</h3>

      <h2 id="totalIncome">
        Rp 0
      </h2>

    </div>

  </section>

  <!-- STORE -->

  <section class="store-section">

    <div
      class="store-box"
      id="storeCard"
    >

      <button id="toggleStore">
        Loading...
      </button>

      <p id="storeStatusText">
        Memuat...
      </p>

    </div>

  </section>

  <!-- STOCK -->

  <section class="stock-section">

    <h2 class="section-heading">
      Atur Stock Topping
    </h2>

    <div id="stockContainer"></div>

  </section>

  <!-- ORDERS -->

  <section class="orders-section">

    <div class="section-title">

      <h2>
        Pesanan Masuk
      </h2>

    </div>

    <div
      class="orders-grid"
      id="ordersGrid"
    >

      <div
        style="
        padding:20px;
        font-size:18px;
        "
      >

        Memuat data...

      </div>

    </div>

  </section>

  <!-- AUDIO -->

  <audio
    id="notifSound"
    preload="auto"
  >

    <source
      src="Orderan masuk.mp3"
      type="audio/mpeg"
    />

  </audio>

  <!-- FIREBASE MODULE -->

  <script type="module" src="script.js"></script>

</body>
</html>
